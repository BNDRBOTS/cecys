<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Aldea - Microhome Community & Dining</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    },
                    colors: {
                        stucco: { 50: '#FAF8F5', 100: '#F4EFE6', 200: '#E8DED0' },
                        adobe: { 400: '#D97757', 500: '#C05A3A', 600: '#A34325', 900: '#4A1D0E' },
                        agave: { 500: '#6B7A6C', 800: '#3A453A' },
                        iron: { 800: '#2D2A26', 900: '#1A1816' }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'elevated': '0 12px 40px -4px rgba(0, 0, 0, 0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FAF8F5; color: #2D2A26; -webkit-font-smoothing: antialiased; }
        .pattern-overlay {
            background-image: radial-gradient(#E8DED0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .img-mask { clip-path: inset(0 0 0 0 round 24px); }
        .smooth-scroll { scroll-behavior: smooth; }
        
        /* Custom Scrollbar for Booking Widget */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E8DED0; border-radius: 10px; }
    </style>
</head>
<body class="smooth-scroll">
    <div id="root"></div>

    <script type="text/babel">
        const IconLocation = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        const IconClock = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="text-adobe-500"><polyline points="20 6 9 17 4 12"/></svg>;
        const IconAlert = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-adobe-600"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;

        const Navigation = () => (
            <nav className="fixed w-full top-0 z-50 bg-stucco-50/90 backdrop-blur-md border-b border-stucco-200 transition-all">
                <div className="max-w-7xl mx-auto px-6 lg:px-8 h-20 flex items-center justify-between">
                    <div className="font-serif text-2xl font-semibold tracking-wide text-iron-900">
                        La Aldea
                    </div>
                    <div className="hidden md:flex space-x-8 text-sm font-medium text-iron-800">
                        <a href="#vision" className="hover:text-adobe-500 transition-colors">The Community</a>
                        <a href="#amenities" className="hover:text-adobe-500 transition-colors">Amenities</a>
                        <a href="#location" className="hover:text-adobe-500 transition-colors">Location</a>
                        <a href="#rules" className="hover:text-adobe-500 transition-colors">Guidelines</a>
                    </div>
                    <a href="#booking" className="bg-iron-900 text-stucco-50 px-5 py-2.5 rounded-full text-sm font-medium hover:bg-adobe-600 transition-colors shadow-sm">
                        Book Your Stay
                    </a>
                </div>
            </nav>
        );

        const BookingWidget = () => (
            <div id="booking" className="bg-white p-6 rounded-2xl shadow-elevated border border-stucco-200 w-full max-w-md mx-auto lg:mx-0 relative z-20">
                <div className="mb-6">
                    <h3 className="text-2xl font-serif text-iron-900 mb-1">Reserve Your Space</h3>
                    <p className="text-sm text-iron-500">Maximum 3 guests per unit.</p>
                </div>
                
                <form className="space-y-4" onSubmit={(e) => e.preventDefault()}>
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className="block text-xs font-semibold uppercase text-iron-800 tracking-wider mb-1.5">Check-in</label>
                            <input type="date" className="w-full bg-stucco-50 border border-stucco-200 rounded-lg px-3 py-2.5 text-iron-900 text-sm focus:ring-2 focus:ring-adobe-500 focus:border-adobe-500 outline-none transition-all" />
                        </div>
                        <div>
                            <label className="block text-xs font-semibold uppercase text-iron-800 tracking-wider mb-1.5">Check-out</label>
                            <input type="date" className="w-full bg-stucco-50 border border-stucco-200 rounded-lg px-3 py-2.5 text-iron-900 text-sm focus:ring-2 focus:ring-adobe-500 focus:border-adobe-500 outline-none transition-all" />
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className="block text-xs font-semibold uppercase text-iron-800 tracking-wider mb-1.5">Guests</label>
                            <select className="w-full bg-stucco-50 border border-stucco-200 rounded-lg px-3 py-2.5 text-iron-900 text-sm focus:ring-2 focus:ring-adobe-500 outline-none cursor-pointer">
                                <option>1 Guest</option>
                                <option>2 Guests</option>
                                <option>3 Guests (Max)</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-semibold uppercase text-iron-800 tracking-wider mb-1.5">Unit Type</label>
                            <select className="w-full bg-stucco-50 border border-stucco-200 rounded-lg px-3 py-2.5 text-iron-900 text-sm focus:ring-2 focus:ring-adobe-500 outline-none cursor-pointer">
                                <option>Restored RV</option>
                                <option>Container Home</option>
                                <option>Tiny House</option>
                            </select>
                        </div>
                    </div>

                    <div className="bg-stucco-100 p-3 rounded-lg flex items-start gap-2 mt-2 border border-stucco-200">
                        <div className="mt-0.5"><IconAlert /></div>
                        <p className="text-xs text-iron-800 leading-relaxed">
                            Volume discounts applied automatically for 7+ or 28+ night stays booked today. Extensions do not retroactively trigger discounts.
                        </p>
                    </div>

                    <button type="submit" className="w-full bg-adobe-500 text-white font-medium py-3.5 rounded-xl hover:bg-adobe-600 transition-colors mt-2 shadow-soft">
                        Check Availability
                    </button>
                </form>
            </div>
        );

        const Hero = () => (
            <header className="relative pt-32 pb-20 lg:pt-40 lg:pb-32 px-6 lg:px-8 max-w-7xl mx-auto flex flex-col lg:flex-row items-center gap-16">
                <div className="lg:w-[55%] relative z-10">
                    <div className="inline-flex items-center space-x-2 bg-stucco-200/50 px-3 py-1.5 rounded-full text-xs font-semibold text-adobe-600 mb-6 uppercase tracking-wider">
                        <span className="w-2 h-2 rounded-full bg-adobe-500"></span>
                        <span>Phase 1 Prototype</span>
                    </div>
                    <h1 className="text-5xl lg:text-7xl font-serif text-iron-900 leading-tight mb-6">
                        A boutique village <br/><span className="text-adobe-500 italic">rooted in tradition.</span>
                    </h1>
                    <p className="text-lg text-iron-800 leading-relaxed mb-8 max-w-xl">
                        A tranquil oasis minutes from downtown Phoenix. Discover our curated collection of 35 restored RVs, container homes, and tiny houses, unified by elevated amenities and our 24/7 automated dining hub.
                    </p>
                    
                    <div className="flex flex-wrap gap-4 text-sm font-medium text-iron-800 mb-8">
                        <div className="bg-white px-4 py-2 rounded-lg shadow-sm border border-stucco-200">✨ 35 Unique Units</div>
                        <div className="bg-white px-4 py-2 rounded-lg shadow-sm border border-stucco-200">🍝 Automated Dining</div>
                        <div className="bg-white px-4 py-2 rounded-lg shadow-sm border border-stucco-200">🛡️ 24/7 Security</div>
                    </div>
                </div>
                
                <div className="lg:w-[45%] w-full relative">
                    <div className="absolute inset-0 pattern-overlay opacity-50 translate-x-4 translate-y-4 rounded-3xl"></div>
                    <BookingWidget />
                </div>
            </header>
        );

        const CommunityVision = () => (
            <section id="vision" className="py-24 bg-white relative overflow-hidden border-y border-stucco-200">
                <div className="max-w-7xl mx-auto px-6 lg:px-8">
                    <div className="text-center max-w-3xl mx-auto mb-20">
                        <h2 className="text-4xl font-serif text-iron-900 mb-6">The Microhome Concept</h2>
                        <p className="text-lg text-iron-800 leading-relaxed">
                            We preserve the intimacy of small-footprint living while scaling the infrastructure to support a vibrant, 35-unit community. It’s the privacy of your own tiny home paired with the social architecture of a boutique hotel.
                        </p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                        <div className="grid grid-cols-2 gap-4 h-[600px]">
                            <img 
                                src="https://images.unsplash.com/photo-1521483756775-c3b8ce1e84ce?q=80&w=800&auto=format&fit=crop" 
                                alt="Modern Tiny Home" 
                                className="w-full h-[380px] object-cover rounded-3xl shadow-soft mt-auto"
                            />
                            <img 
                                src="https://images.unsplash.com/photo-1585776269411-eb672b14620f?q=80&w=800&auto=format&fit=crop" 
                                alt="Automated Dining Kiosk" 
                                className="w-full h-[460px] object-cover rounded-3xl shadow-soft"
                            />
                        </div>
                        <div>
                            <div className="inline-flex items-center justify-center p-3 bg-stucco-100 rounded-xl mb-6">
                                <span className="text-2xl">🍝</span>
                            </div>
                            <h3 className="text-3xl font-serif text-iron-900 mb-4">24/7 Automated Culinary Hub</h3>
                            <p className="text-iron-800 leading-relaxed mb-8">
                                Forget restricted restaurant hours. La Aldea features a state-of-the-art automated dining pavilion operating around the clock. Our signature installation includes advanced hot-food vending technology—featuring on-demand spaghetti and noodle makers that instantly boil, prepare, and serve fresh hot meals right before your eyes.
                            </p>
                            <ul className="space-y-4">
                                {[
                                    '24/7 access to high-tech automated hot-food vending',
                                    'On-demand spaghetti makers with instant hot water preparation',
                                    'Beautifully maintained outdoor communal spaces for dining',
                                    'Zero-contact, seamless integration with your residential stay'
                                ].map((item, i) => (
                                    <li key={i} className="flex items-start">
                                        <div className="mt-1 mr-3"><IconCheck /></div>
                                        <span className="text-iron-800 font-medium">{item}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Amenities = () => {
            const features = [
                {
                    title: 'Fully Stocked Kitchens',
                    desc: 'Cook your own meals with gas stoves, refrigerators, microwaves, and complete sets of pots, pans, and cutlery in every unit.',
                    icon: '🍳'
                },
                {
                    title: 'Central Laundry',
                    desc: 'Access to two dedicated, free-to-use laundry areas equipped with high-capacity washing machines and dryers (detergent not provided).',
                    icon: '🧺'
                },
                {
                    title: 'Entertainment & Tech',
                    desc: 'Fast, dedicated Wi-Fi workspaces paired with 42-inch HDTVs loaded with Amazon Prime, Disney+, Hulu, Netflix, and Roku.',
                    icon: '📺'
                },
                {
                    title: 'Climate & Comfort',
                    desc: 'Central air conditioning and heating ensuring perfect temperatures during 100+ degree summers. Premium linens and extra pillows included.',
                    icon: '❄️'
                }
            ];

            return (
                <section id="amenities" className="py-24 bg-stucco-50 border-b border-stucco-200">
                    <div className="max-w-7xl mx-auto px-6 lg:px-8">
                        <div className="max-w-2xl mb-16">
                            <h2 className="text-4xl font-serif text-iron-900 mb-4">Elevated Comforts</h2>
                            <p className="text-lg text-iron-800">Every tiny home, container, and RV is meticulously organized to provide everything you need for short visits or extended stays.</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {features.map((feat, i) => (
                                <div key={i} className="bg-white p-8 rounded-3xl shadow-soft border border-stucco-200 hover:shadow-elevated transition-shadow">
                                    <div className="text-4xl mb-6">{feat.icon}</div>
                                    <h3 className="text-xl font-semibold text-iron-900 mb-3">{feat.title}</h3>
                                    <p className="text-iron-800 text-sm leading-relaxed">{feat.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const LocationMatrix = () => {
            const locations = [
                { category: 'Transit', name: 'Phoenix Sky Harbor Airport', dist: '10 mi', time: '15-20 min' },
                { category: 'Urban Hub', name: 'Downtown Phoenix (Cityscape)', dist: '2 mi', time: '5-10 min' },
                { category: 'Events', name: 'Phoenix Convention Center', dist: '3 mi', time: '10 min' },
                { category: 'Sports', name: 'Footprint Center (Suns)', dist: '3 mi', time: '10 min' },
                { category: 'Sports', name: 'Chase Field (D-Backs)', dist: '3 mi', time: '10 min' },
                { category: 'Sports', name: 'State Farm Stadium', dist: '12 mi', time: '20 min' },
                { category: 'Culture', name: 'Phoenix Art & Heard Museums', dist: '3-4 mi', time: '10 min' },
                { category: 'Nature', name: 'Desert Botanical & Papago Park', dist: '9 mi', time: '20 min' },
                { category: 'Nature', name: 'South Mountain Preserve', dist: '12 mi', time: '20-25 min' }
            ];

            return (
                <section id="location" className="py-24 bg-iron-900 text-stucco-50 relative">
                    <div className="absolute inset-0 pattern-overlay opacity-10"></div>
                    <div className="max-w-7xl mx-auto px-6 lg:px-8 relative z-10">
                        <div className="flex flex-col md:flex-row md:items-end justify-between mb-16 gap-8">
                            <div className="max-w-2xl">
                                <h2 className="text-4xl font-serif text-white mb-6">Strategic Proximity</h2>
                                <p className="text-lg text-iron-300">Tucked behind secure gates on a quiet street west of downtown. A tranquil retreat that sacrifices none of the connectivity.</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            {locations.map((loc, i) => (
                                <div key={i} className="bg-iron-800/60 backdrop-blur-sm border border-iron-700 p-6 rounded-2xl flex flex-col justify-between hover:bg-iron-800 transition-colors">
                                    <div className="mb-4">
                                        <span className="text-xs font-bold text-adobe-400 uppercase tracking-wider block mb-2">{loc.category}</span>
                                        <h3 className="text-lg font-medium text-white">{loc.name}</h3>
                                    </div>
                                    <div className="flex items-center gap-6 text-sm text-iron-300">
                                        <div className="flex items-center gap-1.5"><IconLocation /> {loc.dist}</div>
                                        <div className="flex items-center gap-1.5"><IconClock /> {loc.time}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const RuleSheet = () => (
            <section id="rules" className="py-24 bg-white">
                <div className="max-w-4xl mx-auto px-6 lg:px-8">
                    <div className="text-center mb-16">
                        <h2 className="text-4xl font-serif text-iron-900 mb-4">Operational Guidelines</h2>
                        <p className="text-iron-800">Clear policies ensuring a secure, consistent experience for all 35 units.</p>
                    </div>

                    <div className="bg-stucco-50 rounded-3xl p-8 md:p-12 border border-stucco-200 shadow-soft space-y-12">
                        
                        <div>
                            <h3 className="text-xl font-bold text-iron-900 mb-4 border-b border-stucco-200 pb-2">Discount Policy</h3>
                            <p className="text-iron-800 mb-4 text-sm leading-relaxed">
                                Discounts are designed as an incentive for making longer reservations at the time of booking, not for incremental extensions. <strong>Discounts offered on this listing are not stackable.</strong> They apply only to reservations made and paid in full at the time of booking.
                            </p>
                            <div className="grid sm:grid-cols-2 gap-4">
                                <div className="bg-white p-4 rounded-xl border border-stucco-200 shadow-sm flex items-center justify-between">
                                    <span className="font-medium text-iron-900">7+ Nights</span>
                                    <span className="text-xs font-bold text-adobe-600 bg-adobe-50 px-3 py-1.5 rounded-full uppercase tracking-wide">Weekly Discount</span>
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-stucco-200 shadow-sm flex items-center justify-between">
                                    <span className="font-medium text-iron-900">28+ Nights</span>
                                    <span className="text-xs font-bold text-adobe-600 bg-adobe-50 px-3 py-1.5 rounded-full uppercase tracking-wide">Monthly Discount</span>
                                </div>
                            </div>
                            <div className="mt-4 bg-iron-900 text-stucco-50 p-4 rounded-xl text-sm italic">
                                Note: If you book for 7 nights and later extend your stay, the platform may attempt to automatically apply the monthly discount once you reach 28 nights. We do not accept this adjustment.
                            </div>
                        </div>

                        <div>
                            <h3 className="text-xl font-bold text-iron-900 mb-4 border-b border-stucco-200 pb-2">Reservation Changes</h3>
                            <ul className="space-y-4 text-iron-800 text-sm">
                                <li className="flex gap-3 items-start">
                                    <div className="mt-0.5"><IconCheck /></div>
                                    <span className="leading-relaxed">Any request to shorten a reservation must be made <strong>at least 5 days in advance</strong>.</span>
                                </li>
                                <li className="flex gap-3 items-start">
                                    <div className="mt-0.5"><IconCheck /></div>
                                    <span className="leading-relaxed">When a reservation is booked under a <strong>Strict cancellation policy</strong>, shortening the reservation is not possible, regardless of notice.</span>
                                </li>
                                <li className="flex gap-3 items-start">
                                    <div className="mt-0.5"><IconCheck /></div>
                                    <span className="leading-relaxed"><strong>NO MORE THAN 3 GUESTS PLEASE.</strong> This policy is strictly enforced to preserve the tranquility of the microhome community.</span>
                                </li>
                            </ul>
                        </div>

                        <div>
                            <h3 className="text-xl font-bold text-iron-900 mb-4 border-b border-stucco-200 pb-2">Property Security</h3>
                            <p className="text-iron-800 text-sm leading-relaxed mb-4">
                                For your safety and the security of the property, exterior cameras are in operation 24/7.
                            </p>
                            <div className="grid sm:grid-cols-3 gap-4">
                                <div className="bg-white p-4 rounded-xl border border-stucco-200 text-sm text-iron-800">
                                    <strong className="block text-iron-900 mb-1">Camera 1</strong> Entrance of the property above the main house.
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-stucco-200 text-sm text-iron-800">
                                    <strong className="block text-iron-900 mb-1">Camera 2</strong> Midway toward the back, above the rear building.
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-stucco-200 text-sm text-iron-800">
                                    <strong className="block text-iron-900 mb-1">Camera 3</strong> Doorbell camera on the rear building.
                                </div>
                            </div>
                            <p className="text-xs text-iron-500 mt-3 text-center uppercase tracking-wide">All cameras point to the driveway and parking areas.</p>
                        </div>

                    </div>
                </div>
            </section>
        );

        const App = () => (
            <main className="min-h-screen selection:bg-adobe-200 selection:text-adobe-900">
                <Navigation />
                <Hero />
                <CommunityVision />
                <Amenities />
                <LocationMatrix />
                <RuleSheet />
                <footer className="bg-iron-900 border-t border-iron-800 py-12 text-center text-iron-400 text-sm">
                    <div className="font-serif text-2xl text-stucco-100 mb-4">La Aldea</div>
                    <p>Microhome UI Deployed. Ready for final asset integration.</p>
                </footer>
            </main>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
```

The rendering sequence is complete. The components now bypass the traditional restaurant references and hardcode the automated vending arrays directly into the community feature list.
